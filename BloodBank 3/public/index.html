<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank DBMS — Enterprise Query Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-container">
                    <div class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="url(#bloodGrad)"/>
                            <defs>
                                <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#ff4b6e"/>
                                    <stop offset="100%" stop-color="#e11d48"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h2>BloodBank</h2>
                        <span class="brand-badge">DBMS Explorer</span>
                    </div>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search queries, tables, SQL...">
                </div>
            </div>

            <div class="sidebar-content">
                <div class="sidebar-section-header">
                    <span class="sidebar-section-title">Business Queries</span>
                    <span class="section-count">20</span>
                </div>
                <div class="query-list" id="queryList">
                    <!-- Queries injected by JS -->
                </div>

                <div class="sidebar-section-header">
                    <span class="sidebar-section-title">Raw Tables</span>
                    <span class="section-count">6</span>
                </div>
                <div class="query-list" id="tableList">
                    <!-- Tables injected by JS -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="stats-overview" id="statsOverview">
                    <div class="stat-card stat-donors">
                        <div class="stat-card-top">
                            <span class="stat-label">Total Donors</span>
                            <div class="stat-icon-wrapper donor-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            </div>
                        </div>
                        <p class="stat-value" id="statDonors">--</p>
                        <span class="stat-meta">Active Registered</span>
                    </div>

                    <div class="stat-card stat-units">
                        <div class="stat-card-top">
                            <span class="stat-label">Blood Units</span>
                            <div class="stat-icon-wrapper unit-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
                            </div>
                        </div>
                        <p class="stat-value" id="statUnits">--</p>
                        <span class="stat-meta">In Stock & Verified</span>
                    </div>

                    <div class="stat-card stat-hospitals">
                        <div class="stat-card-top">
                            <span class="stat-label">Hospitals</span>
                            <div class="stat-icon-wrapper hospital-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path><path d="M9 9v.01"></path><path d="M9 12v.01"></path><path d="M9 15v.01"></path><path d="M9 18v.01"></path></svg>
                            </div>
                        </div>
                        <p class="stat-value" id="statHospitals">--</p>
                        <span class="stat-meta">Partner Network</span>
                    </div>

                    <div class="stat-card stat-requests">
                        <div class="stat-card-top">
                            <span class="stat-label">Hospital Requests</span>
                            <div class="stat-icon-wrapper request-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            </div>
                        </div>
                        <p class="stat-value" id="statRequests">--</p>
                        <span class="stat-meta">Demand Tracking</span>
                    </div>
                </div>

                <div class="query-hero-banner">
                    <div class="query-hero-content">
                        <span class="query-hero-tag" id="queryHeroTag">Selected Query</span>
                        <h1 id="questionTitle">Select a query from the sidebar</h1>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <div class="action-bar" id="actionBar" style="display: none;">
                    <button id="runBtn" class="primary-btn">
                        <svg class="run-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <span>Execute Query</span>
                    </button>
                    <div class="status-pill">
                        <span class="status-indicator" id="statusDot"></span>
                        <span id="statusMessage" class="status-msg">Ready</span>
                    </div>
                </div>

                <!-- Solution Query Display Card -->
                <div class="solution-query-card" id="solutionQueryCard" style="display: none;">
                    <div class="query-card-header">
                        <div class="window-controls">
                            <span class="dot dot-red"></span>
                            <span class="dot dot-yellow"></span>
                            <span class="dot dot-green"></span>
                        </div>
                        <div class="query-card-title-group">
                            <svg class="code-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            <span class="query-card-title">Solution Query</span>
                            <span id="queryBadge" class="query-badge">PostgreSQL</span>
                        </div>
                        <button id="copyQueryBtn" class="copy-query-btn" title="Copy SQL Query to Clipboard">
                            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span id="copyBtnText">Copy SQL</span>
                        </button>
                    </div>
                    <div class="query-card-body">
                        <pre class="query-code-pre"><code id="solutionQueryCode"></code></pre>
                    </div>
                </div>

                <!-- Query Results Output Card -->
                <div class="results-card" id="resultsCard" style="display: none;">
                    <div class="results-card-header">
                        <div class="results-card-title-group">
                            <span class="table-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                            </span>
                            <span class="results-card-title">Output Result Set</span>
                            <span id="rowCountBadge" class="row-count-badge"></span>
                        </div>
                    </div>
                    <div class="table-container">
                        <table id="resultsTable">
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="queryData.js"></script>
    <script src="script.js"></script>
</body>
</html>
